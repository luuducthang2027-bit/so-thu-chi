<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#00463c">
<title>Sổ Thu Chi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, trustworthy personal finance; the month's numbers first
   IDEA: a bank passbook — deep green cover band, ruled ledger rows below
   PICTURE: balance figure large + cumulative income/expense lines for the month
   COLOUR and TYPE: deep green #00463c, lime-white #e6f5c8, coral for spending; Inter Tight + Inter
   LAYOUT: green band (month, balance, figures), cards below; bottom nav + add button on phones */
:root{color-scheme:light;--bg:#f4f7f5;--card:#fff;--soft:#eef3f0;--ink:#0f1f1a;--muted:#56675f;--line:#e0e8e3;--brand:#00463c;--pri:#00463c;--inc:#00805a;--exp:#d4402b;--lime:#e6f5c8;--coral:#ff6f59;--sh:0 1px 2px #0f1f1a0f,0 8px 24px #0f1f1a0d}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0a1310;--card:#111d19;--soft:#182620;--ink:#e7efeb;--muted:#94a79f;--line:#24342e;--brand:#06362e;--pri:#1d8a69;--inc:#45d3a1;--exp:#ff7b67;--sh:none}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0a1310;--card:#111d19;--soft:#182620;--ink:#e7efeb;--muted:#94a79f;--line:#24342e;--brand:#06362e;--pri:#1d8a69;--inc:#45d3a1;--exp:#ff7b67;--sh:none}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
h1,h2,.big,.num,.logo{font-family:"Inter Tight",Inter,system-ui,sans-serif}
h1{font-size:clamp(28px,4vw,40px);line-height:1.05;margin:4px 0 0;text-wrap:balance}
h2{font-size:17px;line-height:1.3;margin:0;font-weight:600}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
.tnum,.num,.big,.v,.ra b,td.r{font-variant-numeric:tabular-nums;white-space:nowrap}
.lang{display:inline-flex;gap:2px;background:#ffffff1a;border-radius:10px;padding:3px;margin-left:auto;flex:none}
.lang button{border:0;background:none;color:#ffffffc7;min-width:40px;height:38px;border-radius:8px;font:600 13px Inter,system-ui,sans-serif}
.lang button.on{background:var(--lime);color:#00463c}
.add-d{margin-left:auto}.add-d+.lang{margin-left:0}
.auth-form{position:relative}
.auth-lang{position:absolute;top:16px;right:16px}
.auth-lang .lang{background:var(--soft)}.auth-lang .lang button{color:var(--muted)}.auth-lang .lang button.on{background:var(--pri);color:#fff}
@media (max-width:900px){.auth-lang{position:fixed;top:14px;right:14px;z-index:5}.auth-lang .lang{background:#ffffff26}.auth-lang .lang button{color:#fff}.auth-lang .lang button.on{background:var(--lime);color:#00463c}.auth-brand{padding-top:72px!important}}
.cb-bar i.thu{background:var(--inc)}
/* calendar */
.calsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--soft);border-radius:12px;padding:12px 6px;margin-bottom:14px;text-align:center}
.calsum div{display:grid;gap:2px;border-left:1px solid var(--line)}.calsum div:first-child{border:0}
.calsum span{font-size:13px;color:var(--muted)}.calsum b{font:600 17px "Inter Tight",Inter,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:12px;color:var(--muted);text-align:center;font-weight:600;padding:2px 0 4px}
.cd{min-height:76px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:6px 7px;display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:1px;color:var(--ink)}
.cd:hover{border-color:var(--muted)}
.cd .dn{font-size:13px;font-weight:600;margin-bottom:auto}
.cd .ci,.cd .ce{font-size:12px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;letter-spacing:-.01em}
.ci{color:var(--inc)}.ce{color:var(--exp)}
.cd.sel{background:var(--soft)}
.cd.today{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.cnav{display:flex;gap:6px}.cnav button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px}
/* period tabs */
.pseg{display:flex;gap:4px;background:#ffffff1a;padding:4px;border-radius:12px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.pseg button{border:0;background:none;color:#ffffffcc;height:38px;padding:0 14px;border-radius:9px;font-weight:600;font-size:14px;white-space:nowrap;flex:none}
.pseg button.on{background:var(--lime);color:#00463c}
.rng{display:flex;gap:10px;flex-wrap:wrap}
.rng label{display:grid;gap:4px;font-size:13px;color:#ffffffc7}
.rng input{height:44px;border-radius:12px;border:1px solid #ffffff38;background:#ffffff1a;color:#fff;padding:0 10px;font-size:16px;color-scheme:dark}
.out{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 12px;border-radius:10px;border:1px solid #ffffff38;background:none;color:#fff;font-weight:600;font-size:14px;flex:none;white-space:nowrap}
.out svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.out:hover{background:#ffffff1a}
.logo{flex:none}.tblw{overflow-x:auto}
@media (max-width:1420px){.out span{display:none}.out{width:44px;padding:0;justify-content:center}.tabs button{padding:0 10px}}
.danger-zone{border-color:color-mix(in srgb,var(--exp) 45%,var(--line))}
.pform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:end;margin-top:14px}
.pform select{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;width:100%}
@media (max-width:900px){.pform{grid-template-columns:minmax(0,1fr)}.out span{display:none}.out{padding:0;width:44px;justify-content:center}.top-in{gap:8px}}
/* top bar */
.top{background:var(--brand);color:#fff;position:sticky;top:0;z-index:20}
.top-in{display:flex;align-items:center;gap:16px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;white-space:nowrap}
.pill{font:600 11px Inter;font-style:normal;background:var(--coral);color:#2a0d07;padding:2px 8px;border-radius:99px}
.tabs{display:flex;gap:4px;margin-left:12px}
.tabs button{display:flex;align-items:center;gap:8px;white-space:nowrap;background:none;border:0;color:#ffffffbf;height:44px;padding:0 14px;border-radius:10px;font-weight:500}
.tabs button.on{background:#ffffff1f;color:#fff}
.tabs svg,.bnav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-weight:600;font-size:15px;background:var(--soft);white-space:nowrap}
.btn.lime{background:var(--lime);color:#00463c}
.btn.primary{background:var(--pri);color:#fff}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:transparent;color:var(--exp);border-color:var(--exp)}
.btn.sm{height:40px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.6;cursor:wait}
.link{background:none;border:0;color:var(--inc);font-weight:600;font-size:14px;padding:8px 0}
/* hero band */
.hero{background:var(--brand);color:#fff;padding:0 0 30px}
.hero.slim{padding-bottom:24px}
.ctx{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:8px 0 18px}
.mpick{display:inline-flex;align-items:center;background:#ffffff1a;border-radius:12px}
.mpick button{width:44px;height:44px;background:none;border:0;color:#fff;font-size:22px;border-radius:12px}
.mpick span{min-width:132px;text-align:center;font-weight:600}
.today{background:none;border:1px solid #ffffff40;color:#fff;height:36px;border-radius:10px;padding:0 12px;font-size:14px;margin-left:6px}
.upick{display:flex;align-items:center;gap:8px;font-size:14px;color:#ffffffbf}
.upick select{height:44px;border-radius:12px;border:1px solid #ffffff38;background:#ffffff1a;color:#fff;padding:0 12px;max-width:240px}
option{color:#111;background:#fff}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:end}
.lbl{font-size:13px;color:#ffffffc7}
.big{font-size:clamp(40px,7vw,64px);font-weight:700;line-height:1;margin:8px 0 10px;letter-spacing:-.02em}
.big.neg{color:#ffb4a6}
.sub{font-size:15px;color:#ffffffd9}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.fig-i{border-top:1px solid #ffffff38;padding-top:10px}
.fig-i .num{font-size:22px;font-weight:600;margin:2px 0}
.fig-i .d{font-size:13px;color:#ffffffb3}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.dot.inc{background:#7fe3bd}.dot.exp{background:var(--coral)}
.lead{color:#ffffffc7;margin:8px 0 0;max-width:62ch}
/* cards */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start;padding-top:20px;padding-bottom:40px}
.span2{grid-column:span 2}.full{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--inc)}.legend i.exp{background:var(--exp)}
.fig{position:relative;height:300px}.fig.sm{height:240px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;touch-action:pan-y}
svg text{font:12px Inter,system-ui,sans-serif;fill:var(--muted)}
svg .lbl-s{font-weight:600;fill:var(--ink)}
.gl{stroke:var(--line);stroke-width:1}
.l-inc,.l-exp{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.l-inc{stroke:var(--inc)}.l-exp{stroke:var(--exp)}
.a-exp{fill:var(--exp);opacity:.07}
.b-inc{fill:var(--inc)}.b-exp{fill:var(--exp)}
.hov line{stroke:var(--muted);stroke-dasharray:3 3}
.hov circle{stroke:var(--card);stroke-width:2}
/* category bars */
.cb{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 0;border-radius:8px}
.cb-t{display:flex;align-items:center;gap:10px}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.v{font-weight:600;font-size:15px}
.cb-bar{display:grid;grid-template-columns:minmax(0,1fr) 40px;align-items:center;gap:8px;margin:6px 0 0 38px}
.cb-bar div{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.cb-bar i{display:block;height:100%;background:var(--exp);border-radius:4px}
.cb-bar em{font-style:normal;font-size:12px;color:var(--muted);text-align:right}
.badge{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:600 11px Inter;color:var(--ink);background:var(--soft);background:color-mix(in srgb,var(--c) 20%,var(--card));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 55%,transparent)}
/* ledger rows */
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover .rt b{text-decoration:underline;text-decoration-color:var(--line)}
.rt b,.rt span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt b{font-size:15px;font-weight:600}.rt span,.ra span{font-size:13px;color:var(--muted)}
.ra{text-align:right}.ra b{display:block;font-size:15px}
.thu{color:var(--inc)}.chi{color:var(--exp)}
.tag{font-size:11px;font-weight:500;background:var(--soft);color:var(--muted);padding:1px 7px;border-radius:6px;margin-left:6px;vertical-align:1px}
.empty{text-align:center;color:var(--muted);padding:28px 8px;font-size:14px}
.fixbn{grid-column:1/-1;background:var(--lime);color:#00463c;border:0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.fixbn .btn{background:#00463c;color:#fff}
/* transactions */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.in,.filters input,.filters select,.form select{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;width:100%}
.filters input{flex:1 1 220px;width:auto}.filters select{width:auto;flex:0 1 200px}
.seg{display:inline-flex;background:var(--soft);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;height:38px;padding:0 14px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0000001f}
.sumline{font-size:14px;color:var(--muted);margin:16px 2px 10px;display:flex;flex-wrap:wrap;gap:6px 16px}
.sumline b{font-variant-numeric:tabular-nums}
.day{margin-bottom:12px;padding-top:12px;padding-bottom:6px}
.dh{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--line);text-transform:none}
.dh span:first-child::first-letter{text-transform:uppercase}
/* forms */
.form{display:grid;gap:12px}
.form label,.f{display:grid;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--exp);font-size:14px;min-height:20px;margin:6px 0 0}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.tbl .r{text-align:right}
.acts{display:flex;gap:6px;justify-content:flex-end}.tbl th,.tbl td b{white-space:nowrap}
.role{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--soft)}
.role.admin{background:var(--lime);color:#00463c}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.auth-brand{background:var(--brand);color:#fff;padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.auth-brand p{color:#ffffffcc;max-width:44ch;margin:12px 0 0;font-size:17px}
.auth-art{width:100%;max-width:480px;height:auto;align-self:center}
.auth-form{display:grid;place-items:center;padding:24px}
.auth-form .card{width:min(420px,100%);padding:26px}
.auth-form .seg{display:grid;grid-template-columns:1fr 1fr;margin-bottom:18px}
.demo-note{font-size:13px;background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:14px;color:var(--muted)}
.demo-note b{color:var(--ink)}
/* nav for phones */
.bnav{display:none}
.fab{display:none}
main{padding-bottom:24px}
/* modal */
.modal{position:fixed;inset:0;background:#06110dcc;z-index:50;display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--card);border-radius:18px;width:min(520px,100%);max-height:92vh;overflow:auto;padding:20px;animation:up .22s ease-out}
.sheet.sm{width:min(400px,100%)}
.sheet header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet p{margin:8px 0 0}
.x{width:44px;height:44px;border-radius:12px;border:0;background:var(--soft);font-size:22px;line-height:1}
.ttype{display:grid;grid-template-columns:1fr 1fr;width:100%}
.ttype button{height:44px}
.ttype button.on[data-t=chi]{background:var(--exp);color:#fff}
.ttype button.on[data-t=thu]{background:var(--inc);color:#fff}
.amt{display:grid;gap:4px;margin:16px 0 6px;font-size:14px;font-weight:600;color:var(--muted)}
.amt input{font:700 34px "Inter Tight",Inter,sans-serif;height:60px;border:0;border-bottom:2px solid var(--line);background:none;width:100%;padding:0;color:var(--ink);font-variant-numeric:tabular-nums}
.amt input:focus{outline:0;border-color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 8px}
.chip{height:38px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px}
.chip.addc{border-style:dashed;color:var(--inc);font-weight:600}
.newcat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:4px}.newcat[hidden]{display:none}
.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--card));font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex!important;align-items:center;gap:10px;font-weight:400!important;color:var(--ink)!important;margin-top:12px}
.chk input{width:20px;height:20px;accent-color:var(--pri)}
.sheet footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#0f1f1a;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
.tip{position:fixed;z-index:40;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;box-shadow:0 6px 20px #0000002a;min-width:170px}
.tip b{display:block;margin-bottom:4px}.tip div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
@media (max-width:1240px){.tabs svg{display:none}.tabs button{padding:0 11px}.logo .pill{display:none}}
@media (max-width:900px){
 .tabs,.add-d{display:none}.add-d+.lang{margin-left:auto}
 .grid{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}
 .hero-grid{grid-template-columns:minmax(0,1fr);gap:18px}
 main{padding-bottom:110px}
 .fixbn{margin-top:4px}
 .bnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;background:var(--brand);border-radius:24px;height:68px;padding:0 4px;box-shadow:0 12px 32px #00231d59,0 0 0 1px #ffffff14 inset}
 .bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:60px;background:none;border:0;font-size:11px;color:#ffffffa6;font-weight:500;white-space:nowrap}
 .bnav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
 .bnav button.on{color:#fff}.bnav button.on svg{stroke:var(--lime)}
 .bnav .mid{justify-self:center;width:56px;height:56px;border-radius:50%;background:var(--lime);color:#00463c;box-shadow:0 6px 18px #0000004d}
 .bnav .mid svg{width:28px;height:28px;stroke-width:2.6}
 .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:18px;border:0;background:var(--coral);color:#2a0d07;z-index:31;box-shadow:0 8px 24px #0000003d}
 .fab svg{width:28px;height:28px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
 .toast{bottom:100px}
 .auth{grid-template-columns:minmax(0,1fr)}
 .auth-brand{padding:28px 20px}.auth-art{max-width:320px}
}
@media (max-width:600px){
 .figs{grid-template-columns:1fr 1fr}.figs .fig-i:last-child{grid-column:1/-1}
 .fig-i .num{font-size:19px}
 .modal{place-items:end stretch;padding:0}

  const cur = S.tx.filter(x => x.username === me && x.datetime.startsWith(S.month));

}

const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = x => new Date(x + 'T00:00');
const addDays = (x, n) => { const d = parseD(x); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
function rpRange() {
  const r = S.rp, a = parseD(r.anchor);
  if (r.mode === 'day') return [r.anchor, r.anchor];
  if (r.mode === 'week') { const st = addDays(r.anchor, -((a.getDay() + 6) % 7)); return [st, addDays(st, 6)]; }
  if (r.mode === 'month') { const m = r.anchor.slice(0, 7); return [m + '-01', m + '-' + pad(daysIn(m))]; }
  if (r.mode === 'quarter') { const y = a.getFullYear(), q = Math.floor(a.getMonth() / 3), em = `${y}-${pad(q * 3 + 3)}`; return [`${y}-${pad(q * 3 + 1)}-01`, em + '-' + pad(daysIn(em))]; }
  if (r.mode === 'year') return [`${a.getFullYear()}-01-01`, `${a.getFullYear()}-12-31`];
  return r.from <= r.to ? [r.from, r.to] : [r.to, r.from];
}
function rpShift(k) {
  const r = S.rp;
  if (r.mode === 'day') r.anchor = addDays(r.anchor, k);
  else if (r.mode === 'week') r.anchor = addDays(r.anchor, 7 * k);
  else if (r.mode === 'month') r.anchor = addMonth(r.anchor.slice(0, 7), k) + '-01';
  else if (r.mode === 'quarter') r.anchor = addMonth(r.anchor.slice(0, 7), 3 * k) + '-01';
  else if (r.mode === 'year') r.anchor = `${+r.anchor.slice(0, 4) + k}-01-01`;
  else { const [a, b] = rpRange(), n = diffDays(a, b) + 1; r.from = addDays(a, n * k); r.to = addDays(b, n * k); }
}
function rpLabel() {
  const [a, b] = rpRange(), r = S.rp, A = parseD(a), Bd = parseD(b);
  if (r.mode === 'day') return dayLabel(a);
  if (r.mode === 'month') return monthLabel(a.slice(0, 7));
  if (r.mode === 'quarter') return L[LANG].quarterFmt(Math.floor(A.getMonth() / 3) + 1, A.getFullYear());
  if (r.mode === 'year') return L[LANG].yearFmt(A.getFullYear());
  return `${dmLabel(A.getDate(), A.getMonth() + 1)}${A.getFullYear() !== Bd.getFullYear() ? ' ' + A.getFullYear() : ''} – ${dmLabel(Bd.getDate(), Bd.getMonth() + 1)} ${Bd.getFullYear()}`;
}
const rpTx = () => { const [a, b] = rpRange(); return visible().filter(x => { const d = x.datetime.slice(0, 10); return d >= a && d <= b; }); };
function rpBuckets(T) {
  const [a, b] = rpRange(), n = diffDays(a, b) + 1, mode = S.rp.mode;
  const unit = mode === 'day' ? null : mode === 'quarter' ? 'week' : (mode === 'year' || n > 62) ? 'month' : 'day';
  if (!unit) return null;
  const B = [];
  if (unit === 'day') for (let i = 0; i < n; i++) { const d = addDays(a, i), D = parseD(d); B.push({ key: d, label: mode === 'week' ? L[LANG].wd[(D.getDay() + 6) % 7] : String(D.getDate()), title: dayLabel(d), pick: { mode: 'day', anchor: d } }); }
  if (unit === 'week') { let st = addDays(a, -((parseD(a).getDay() + 6) % 7)); while (st <= b) { const D = parseD(st), E = parseD(addDays(st, 6)); B.push({ key: st, label: dmLabel(D.getDate(), D.getMonth() + 1), title: `${dmLabel(D.getDate(), D.getMonth() + 1)} – ${dmLabel(E.getDate(), E.getMonth() + 1)}`, pick: { mode: 'week', anchor: st } }); st = addDays(st, 7); } }
  if (unit === 'month') { let m = a.slice(0, 7); const multiY = a.slice(0, 4) !== b.slice(0, 4); while (m <= b.slice(0, 7)) { B.push({ key: m, label: L[LANG].mshort[+m.slice(5) - 1] + (multiY ? ' ' + m.slice(2, 4) : ''), title: monthLabel(m), pick: { mode: 'month', anchor: m + '-01' } }); m = addMonth(m, 1); } }
  B.forEach(x => { x.thu = 0; x.chi = 0; });
  const idx = {}; B.forEach((x, i) => idx[x.key] = i);
  T.forEach(x => {
    const d = x.datetime.slice(0, 10); let i;
    if (unit === 'day') i = idx[d]; else if (unit === 'month') i = idx[d.slice(0, 7)]; else i = Math.floor(diffDays(B[0].key, d) / 7);

}

    const orig = S.tx.find(y => y.id === x.id);
    if (!await ask(t('delTxQ'), `${catName(x.category)} · ${fmt(x.amount)} · ${x.datetime.replace('T', ' ')}. ${t('noUndo')}`, t('del'), true)) return openTx(orig);
    try { await api('deleteTx', { id: x.id }); S.tx = S.tx.filter(y => y.id !== x.id); renderView(); toast(t('deletedTx')); } catch (y) { toast(errText(y)); }
  };
}

/* ====== NGƯỜI DÙNG (ADMIN) ====== */

  <section class="wrap grid">

      ${S.users.map(u => { const T = S.tx.filter(x => x.username === u.username && x.datetime.startsWith(m)); return `<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.username)}</td><td><span class="role ${u.role === 'admin' ? 'admin' : ''}">${u.role === 'admin' ? t('roleAdmin') : t('regular')}</span></td>

    <article class="card"><header class="ch"><h2>${t('newUser')}</h2></header>
      <form class="form" id="fNewU" novalidate>
        <label>${t('username')}<input class="in" id="nuUser" autocapitalize="none" spellcheck="false" required></label>
        <label>${t('password')}<input class="in" id="nuPass" type="text" required></label>
        <label>${t('fullNameOpt')}<input class="in" id="nuName"></label>
        <label>${t('role')}<select id="nuRole"><option value="user">${t('roleUser')}</option><option value="admin">${t('roleAdmin')}</option></select></label>
        <p class="hint">${t('regHint')}</p>
        <button class="btn primary">${t('register')}</button><p class="err" id="nuErr"></p>
      </form></article>
    <article class="card span2 danger-zone"><header class="ch"><h2>${t('purgeTitle')}</h2></header><p class="hint">${t('purgeHint')}</p>
      <form class="pform" id="fPurge" novalidate>
        <label class="f">${t('account')}<select id="pgUser"><option value="all">${t('allUsers')}</option>${S.users.map(u => `<option value="${esc(u.username)}">${esc(u.name)} (${esc(u.username)})</option>`).join('')}</select></label>
        <label class="f">${t('purgePeriod')}<select id="pgMonth"><option value="">${t('purgeAll')}</option>${[...new Set(S.tx.map(x => x.datetime.slice(0, 7)))].sort().reverse().map(m => `<option value="${m}">${monthLabel(m)}</option>`).join('')}</select></label>
        <label class="f">${t('adminPw')}<input class="in" id="pgPw" type="password" autocomplete="current-password"></label>
        <button class="btn danger">${t('purgeBtn')}</button>
      </form><p class="err" id="pgErr"></p></article>
  </section>`;
}
function bindUsers() {
  document.getElementById('fNewU').onsubmit = async e => {
    e.preventDefault(); const err = document.getElementById('nuErr'), btn = e.target.querySelector('button');
    btn.disabled = true; err.textContent = '';
    try { await api('createUser', { name: document.getElementById('nuName').value, username: document.getElementById('nuUser').value, password: document.getElementById('nuPass').value, role: document.getElementById('nuRole').value }); S.users = (await api('listUsers')).users; renderView(); toast(t('userCreated')); }
    catch (x) { err.textContent = errText(x); btn.disabled = false; }
  };
  document.getElementById('fPurge').onsubmit = async e => {
    e.preventDefault(); const err = document.getElementById('pgErr'); err.textContent = '';
    const un = document.getElementById('pgUser').value, mo = document.getElementById('pgMonth').value, pw = document.getElementById('pgPw').value;
    const n = S.tx.filter(x => (un === 'all' || x.username === un) && (!mo || x.datetime.startsWith(mo))).length;
    if (!n) { err.textContent = t('purgeNone'); return; }
    if (!pw) { err.textContent = t('adminPw'); return; }
    if (!await ask(t('purgeQ', { n }), `${un === 'all' ? t('allUsers') : uname(un)} · ${mo ? monthLabel(mo) : t('purgeAll')}. ${t('noUndo')}`, t('purgeBtn'), true)) return;
    try { const r = await api('purgeTx', { username: un, month: mo, password: pw }); await loadData(); renderView(); toast(t('purgeDone', { n: r.deleted })); }
    catch (x) { renderView(); const el = document.getElementById('pgErr'); if (el) el.textContent = errText(x); }
  };
  document.querySelectorAll('[data-uview]').forEach(b => b.onclick = () => { S.viewUser = b.dataset.uview; S.view = 'home'; renderApp(); });
  document.querySelectorAll('[data-udel]').forEach(b => b.onclick = async () => {
    const un = b.dataset.udel; if (!await ask(t('delUserQ'), t('delUserMsg', { n: uname(un), u: un }), t('delUserBtn'), true)) return;
    try { await api('deleteUser', { username: un }); S.users = S.users.filter(u => u.username !== un); S.tx = S.tx.filter(x => x.username !== un); if (S.viewUser === un) S.viewUser = 'all'; renderView(); toast(t('userDeleted')); } catch (x) { toast(errText(x)); }
  });
  document.querySelectorAll('[data-ureset]').forEach(b => b.onclick = () => {
    const un = b.dataset.ureset;
    openModal(`<form class="sheet sm" id="fRs"><header><h2>${t('resetTitle')}</h2><button type="button" class="x" data-close aria-label="${t('close')}">×</button></header><p class="hint">${t('account')}: <b>${esc(uname(un))}</b> (${esc(un)})</p>
      <label class="f" style="margin-top:12px">${t('newPw')}<input class="in" id="rsPass" type="text" required></label><p class="err" id="rsErr"></p>
      <footer><button type="button" class="btn ghost" data-close>${t('cancel')}</button><button class="btn primary">${t('savePw')}</button></footer></form>`);
    document.getElementById('fRs').onsubmit = async e => { e.preventDefault(); try { await api('resetPassword', { username: un, password: document.getElementById('rsPass').value }); closeModal(); toast(t('pwReset')); } catch (x) { document.getElementById('rsErr').textContent = errText(x); } };
  });
}

/* ====== CÀI ĐẶT ====== */

  return `<section class="hero slim"><div class="wrap"><div class="ctx" style="padding-bottom:4px"></div><h1>${t('settingsTitle')}</h1><p class="lead">${t('loggedAs', { n: esc(S.user.name), u: esc(S.user.username), r: isAdmin() ? t('roleAdmin') : t('roleUser') })}</p></div></section>
  <section class="wrap grid">
    <article class="card"><header class="ch"><h2>${t('profile')}</h2></header><form class="form" id="fProf">
      <label>${t('fullName')}<input class="in" id="pfName" value="${esc(S.user.name)}"></label>
      <label>${t('currency')}<select id="pfCur">${[['USD', 'USD – $'], ['HTG', 'HTG – Gourde'], ['VND', 'VND – ₫'], ['EUR', 'EUR – €']].map(([k, l]) => `<option value="${k}" ${S.cur === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <p class="hint">${t('curHint')}</p>
      <button class="btn primary">${t('save')}</button></form></article>

      <label>${t('curPw')}<input class="in" id="pwOld" type="password" autocomplete="current-password"></label>
      <label>${t('newPw')}<input class="in" id="pwNew" type="password" autocomplete="new-password"></label>
      <label>${t('password2')}<input class="in" id="pwNew2" type="password" autocomplete="new-password"></label>

    <article class="card"><header class="ch"><h2>${t('data')}</h2></header>
      <dl class="kv"><dt>${t('storage')}</dt><dd>${DEMO ? t('storDemo') : t('storSheet')}</dd><dt>${t('nav_tx')}</dt><dd>${S.tx.length}</dd>${isAdmin() ? `<dt>${t('account')}</dt><dd>${S.users.length}</dd>` : ''}</dl>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><button class="btn ghost" id="reload">${t('reload')}</button>${DEMO ? `<button class="btn ghost" id="resetDemo">${t('resetDemo')}</button>` : ''}<button class="btn danger" id="logout">${t('logout')}</button></div></article>
  </section>`;
}
function bindSettings() {
  document.getElementById('fProf').onsubmit = async e => {
    e.preventDefault(); S.cur = document.getElementById('pfCur').value; store.set('ct_cur', S.cur);
    const name = document.getElementById('pfName').value.trim();
    try { if (name && name !== S.user.name) { S.user = (await api('updateProfile', { name })).user; const u = S.users.find(x => x.username === S.user.username); if (u) u.name = S.user.name; } renderView(); toast(t('savedOk')); } catch (x) { toast(errText(x)); }
  };
  document.getElementById('fPw').onsubmit = async e => {
    e.preventDefault(); const err = document.getElementById('pwErr');
    if (document.getElementById('pwNew').value !== document.getElementById('pwNew2').value) { err.textContent = t('pwMismatch'); return; }
    try { await api('changePassword', { oldPassword: document.getElementById('pwOld').value, newPassword: document.getElementById('pwNew').value }); e.target.reset(); err.textContent = ''; toast(t('pwChanged')); if (!DEMO) { store.set('ct_token', null); S.user = null; renderLogin('login', errText(Error('pw_changed'))); } } catch (x) { err.textContent = errText(x); }
  };
  document.getElementById('reload').onclick = async () => { try { await loadData(); renderView(); toast(t('reloaded')); } catch (x) { toast(errText(x)); } };
  const rd = document.getElementById('resetDemo');
  if (rd) rd.onclick = async () => { if (await ask(t('resetDemo') + '?', t('resetDemoMsg'), t('restore'), true)) { store.set('ct_demo_db_v4', null); store.set('ct_token', null); location.reload(); } };
  document.getElementById('logout').onclick = () => logout();
}

/* ====== ĐĂNG XUẤT + TỰ THOÁT SAU 2 PHÚT ====== */
const IDLE_MS = 2 * 60 * 1000;
function logout(msg) { store.set('ct_token', null); store.set('ct_last', null); S.token = S.user = null; S.tx = []; S.users = []; S.viewUser = 'all'; S.view = 'home'; if (!modal.hidden) closeModal(); tip.hidden = true; renderLogin('login', msg || ''); }
const touch = () => { if (S.user) store.set('ct_last', Date.now()); };
let lastAct = Date.now();
['pointerdown', 'keydown', 'wheel', 'touchstart', 'scroll'].forEach(ev => addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true, capture: true }));
setInterval(() => { if (!S.user) return; const last = Math.max(lastAct, +store.get('ct_last') || 0); if (Date.now() - last > IDLE_MS) logout(t('autoOut')); else if (Date.now() - lastAct < 15000) touch(); }, 5000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.user && Date.now() - Math.max(lastAct, +store.get('ct_last') || 0) > IDLE_MS) logout(t('autoOut')); });

/* ====== MODAL, TOAST ====== */
function openModal(html) { modal.innerHTML = html; modal.hidden = false; document.body.style.overflow = 'hidden'; }
function closeModal() { modal.hidden = true; modal.innerHTML = ''; document.body.style.overflow = ''; }
function ask(title, msg, ok, danger) {
  return new Promise(res => {
    openModal(`<div class="sheet sm" role="alertdialog"><h2>${esc(title)}</h2><p class="hint">${esc(msg)}</p><footer><button class="btn ghost" data-r="0">${t('cancel')}</button><button class="btn ${danger ? 'danger' : 'primary'}" data-r="1">${esc(ok)}</button></footer></div>`);
    modal.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { closeModal(); res(b.dataset.r === '1'); });
  });
}
let tt; function toast(m) { const el = document.getElementById('toast'); el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2600); }
modal.addEventListener('click', e => { if (e.target === modal || e.target.closest('[data-close]')) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !modal.hidden) closeModal();
  if (e.key === 'Enter' && e.target.matches && e.target.matches('.row[data-edit]')) e.target.click();
});

/* ====== SỰ KIỆN CHUNG ====== */
document.addEventListener('click', async e => {
  const lb = e.target.closest('[data-lang]'); if (lb) { setLang(lb.dataset.lang); return; }
  if (e.target.closest('[data-logout]')) { logout(); return; }
  const el = e.target.closest('[data-nav],[data-add],[data-m],[data-today],[data-edit],[data-cat],[data-fixed],[data-day],[data-rpm],[data-rps],[data-calm]');
  if (!el || !S.user || el.closest('#modal')) return;
  if (el.dataset.nav) { S.view = el.dataset.nav; renderApp(); scrollTo(0, 0); }
  else if (el.hasAttribute('data-add')) openTx();
  else if (el.dataset.m) { S.month = addMonth(S.month, +el.dataset.m); renderView(); }
  else if (el.hasAttribute('data-today')) { S.month = curMonth(); renderView(); }
  else if (el.dataset.edit) { const x = S.tx.find(y => y.id === el.dataset.edit); if (x) openTx(x); }
  else if (el.dataset.day) { S.rp.mode = 'day'; S.rp.anchor = el.dataset.day; S.view = 'report'; renderApp(); scrollTo(0, 0); }
  else if (el.dataset.rpm) {
    const m = el.dataset.rpm, [a, b] = rpRange();
    if (m === 'custom') { S.rp.from = a; S.rp.to = b; } else if (S.rp.mode === 'custom') S.rp.anchor = b > nowLocal().slice(0, 10) ? nowLocal().slice(0, 10) : b;
    S.rp.mode = m; renderView();
  }
  else if (el.dataset.rps) { rpShift(+el.dataset.rps); renderView(); }
  else if (el.dataset.calm) { const cm = addMonth(document.querySelector('[data-day]').dataset.day.slice(0, 7), +el.dataset.calm); S.rp.mode = 'month'; S.rp.anchor = cm + '-01'; renderView(); }
  else if (el.dataset.cat) { S.f = { q: '', type: 'all', cat: el.dataset.cat }; S.view = 'tx'; renderApp(); }
  else if (el.hasAttribute('data-fixed')) {
    const todo = fixedTodo(), nd = daysIn(S.month);
    el.disabled = true;
    const items = todo.map(x => ({ type: x.type, category: x.category, amount: x.amount, note: x.note, fixed: true, username: x.username, datetime: `${S.month}-${pad(Math.min(nd, +x.datetime.slice(8, 10)))}T${x.datetime.slice(11)}` }));
    try { const r = await api('addMany', { items }); S.tx.push(...r.tx.map(normTx)); renderView(); toast(t('fixedAdded', { n: items.length })); } catch (x) { toast(errText(x)); el.disabled = false; }
  }
});
document.addEventListener('change', e => { if (e.target.id === 'uSel') { S.viewUser = e.target.value; renderView(); } });

/* ====== KHỞI ĐỘNG ====== */
(async () => {
  document.documentElement.lang = LANG; document.title = t('appName');
  app.innerHTML = `<div class="loading">${t('loading')}</div>`;
  S.token = store.get('ct_token');
  if (S.token && Date.now() - (+store.get('ct_last') || 0) > IDLE_MS) { store.set('ct_token', null); S.token = null; return renderLogin('login', t('autoOut')); }
  if (!S.token) return renderLogin();
  try { S.user = (await api('me')).user; lastAct = Date.now(); touch(); await loadData(); renderApp(); }
  catch (e) { store.set('ct_token', null); S.token = null; renderLogin('login', errText(e)); }
})();
}
